<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>

    <!-- Glowing Monogram Gradient (Electric Blue-Purple) -->
    <linearGradient id="azGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Star Accent Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base for Chrome Shortcut & App Icon -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Center Ambient Core Glow -->
  <circle cx="256" cy="256" r="170" fill="#6366F1" opacity="0.22" filter="url(#softGlow)" />

  <!-- Monogram Logo Structure "AZ" -->
  <g filter="url(#softGlow)">
    <!-- Letter 'A' Geometric Block -->
    <path d="M 160 360 L 225 150 C 228 140 238 132 250 132 L 262 132 C 274 132 284 140 287 150 L 352 360 C 356 373 346 384 332 384 L 300 384 C 290 384 282 377 279 368 L 270 336 L 242 336 L 233 368 C 230 377 222 384 212 384 L 180 384 C 166 384 156 373 160 360 Z M 256 220 L 248 288 L 264 288 Z" fill="url(#azGrad)" />

    <!-- 'Z' Slash Ribbon Accent overlay -->
    <path d="M 290 148 L 390 148 C 402 148 410 158 406 170 L 320 310 L 400 310 C 412 310 420 320 418 332 L 414 348 C 411 360 400 368 388 368 L 290 368 C 278 368 270 358 274 346 L 360 206 L 280 206 C 268 206 260 196 262 184 L 266 168 C 269 156 280 148 290 148 Z" fill="url(#accentGrad)" opacity="0.95" />

    <!-- AI Sparkle / Star Emblem top right -->
    <path d="M 390 110 Q 390 140 420 140 Q 390 140 390 170 Q 390 140 360 140 Q 390 140 390 110 Z" fill="url(#starGrad)" />
    <circle cx="390" cy="140" r="8" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
