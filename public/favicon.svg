<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#311B92" />
    </linearGradient>

    <!-- Glowing Monogram Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base with Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="#4338CA" stroke-width="8" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="#6366F1" opacity="0.15" filter="url(#glow)" />

  <!-- Monogram "T" / "A" Geometric Emblem -->
  <g filter="url(#glow)">
    <!-- Top Horizontal Bar of "T" -->
    <path d="M 120 136 C 120 122.7 130.7 112 144 112 L 368 112 C 381.3 112 392 122.7 392 136 L 392 168 C 392 181.3 381.3 192 368 192 L 144 192 C 130.7 192 120 181.3 120 168 Z" fill="url(#brandGrad)" />
    
    <!-- Vertical Stem of "T" with dynamic angled base -->
    <path d="M 216 192 L 296 192 L 296 360 C 296 386.5 274.5 408 248 408 L 224 408 C 210.7 408 200 397.3 200 384 L 200 208 C 200 199.2 207.2 192 216 192 Z" fill="url(#brandGrad)" />

    <!-- Sharp Tech Chevron / Diamond Accent for "Azbhy" -->
    <polygon points="340,240 380,280 340,320 300,280" fill="url(#emeraldGrad)" />
    
    <!-- Glowing AI Core Dot -->
    <circle cx="340" cy="280" r="14" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
